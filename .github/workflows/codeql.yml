name: CodeQL

on:
  push:
    branches: [ main, 'release/*', 'release-candidate/*' ]
  pull_request:
    branches: [ main, 'release/*', 'release-candidate/*' ]
  schedule:
    - cron: '45 5 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: csharp

    - name: Build
      run: dotnet build -c Release src/PlainTextReport/PlainTextReport.csproj

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

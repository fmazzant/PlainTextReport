name: CI

on:
  push:
    branches: [ main, 'release/*', 'release-candidate/*' ]
  pull_request:
    branches: [ main, 'release/*', 'release-candidate/*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        # .NET 8 runtime for the net8.0 tests; the SDK version comes from global.json
        dotnet-version: 8.0.x
        global-json-file: global.json

    - name: Restore
      run: dotnet restore src/PlainTextReport.sln

    - name: Build
      run: dotnet build --no-restore -c Release src/PlainTextReport.sln

    - name: Test
      run: dotnet test --no-build -c Release src/PlainTextReport.sln --logger trx --results-directory TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: TestResults

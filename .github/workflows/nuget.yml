name: NuGet

# Publishes on NuGet from a version tag (v1.2.3) or a manual run. A tag push also creates the GitHub Release of the
# tag, with the packages attached and the notes of the matching "## [x.y.z]" section of CHANGELOG.md.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (empty = the version in the csproj)'
        required: false
        type: string

permissions:
  contents: write # needed to create the GitHub Release
  # Required by NuGet Trusted Publishing: GitHub issues the OIDC token exchanged for a temporary API key
  id-token: write

jobs:
  build:

    runs-on: ubuntu-latest
    # Must match the Environment of the NuGet Trusted Publishing policy
    environment: production

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        # .NET 8 runtime for the net8.0 tests; the SDK version comes from global.json
        dotnet-version: 8.0.x
        global-json-file: global.json

    # Not named VERSION: MSBuild reads environment variables as properties,
    # so VERSION=main would become the package version during restore
    - name: Get package version
      env:
        DISPATCH_VERSION: ${{ inputs.version }}
      run: |
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
        else
          PACKAGE_VERSION="$DISPATCH_VERSION"
        fi
        echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

    - name: Restore dependencies
      run: dotnet restore src/PlainTextReport.sln --verbosity normal

    - name: Build
      run: dotnet build --no-restore -c Release ${PACKAGE_VERSION:+"-p:Version=$PACKAGE_VERSION"} src/PlainTextReport.sln

    - name: Test
      run: dotnet test --no-build -c Release src/PlainTextReport.sln

    - name: Package
      run: dotnet pack --no-build -c Release ${PACKAGE_VERSION:+"-p:Version=$PACKAGE_VERSION"} -o . src/PlainTextReport/PlainTextReport.csproj

    # Trusted Publishing: exchanges the GitHub OIDC token for a short-lived NuGet API key
    - name: NuGet login
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish on NuGet
      run: dotnet nuget push ./*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

    # Tag push only: creates the GitHub Release of the tag with the packages attached and the notes of the matching
    # "## [x.y.z]" section of CHANGELOG.md. Never blocks the publish: a missing or empty section only gives a warning
    # and a release with a link to CHANGELOG.md. A release created by hand on GitHub (which also creates the tag and
    # starts this run) is kept as it is, title and notes included: only the packages are attached, replacing those
    # of a previous run.
    - name: Extract the release notes from CHANGELOG.md
      if: github.ref_type == 'tag'
      run: |
        # Keep a Changelog headings: "## [1.2.3] - 2026-12-01", "## [1.2.3] - Unreleased", "## 1.2.3", ...
        RELEASE_VERSION="${GITHUB_REF_NAME#v}"
        HEADING="$(grep -E "^## \[?${RELEASE_VERSION//./\\.}\]?( |$)" CHANGELOG.md | head -n 1 | tr -d '\r')"
        NOTES="$RUNNER_TEMP/release-notes.md"
        : > "$NOTES"
        if [ -n "$HEADING" ]; then
          # Prints the lines between the heading and the next "## " heading.
          awk -v heading="$HEADING" '
            { sub(/\r$/, "") }
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES"
        fi
        if ! grep -q '[^[:space:]]' "$NOTES"; then
          echo "::warning::CHANGELOG.md has no notes for $RELEASE_VERSION: the release links to CHANGELOG.md"
          echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)." > "$NOTES"
        fi

    - name: Create the GitHub Release
      if: github.ref_type == 'tag'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        shopt -s nullglob
        packages=(./*.nupkg ./*.snupkg)
        if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
          echo "The release $GITHUB_REF_NAME already exists: attaching the packages"
          gh release upload "$GITHUB_REF_NAME" "${packages[@]}" --clobber
        else
          gh release create "$GITHUB_REF_NAME" "${packages[@]}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag
        fi

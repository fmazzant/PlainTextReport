name: Publish PlainTextReport on NuGet

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (empty = the version in the csproj)'
        required: false
        type: string

permissions:
  contents: read
  # Required by NuGet Trusted Publishing: GitHub issues the OIDC token exchanged for a temporary API key
  id-token: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # .NET 8 runtime for the net8.0 tests; the SDK version comes from global.json
        dotnet-version: 8.0.x
        global-json-file: global.json

    # Not named VERSION: MSBuild reads environment variables as properties,
    # so VERSION=main would become the package version during restore
    - name: Get package version
      env:
        DISPATCH_VERSION: ${{ inputs.version }}
      run: |
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
        else
          PACKAGE_VERSION="$DISPATCH_VERSION"
        fi
        echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

    - name: Restore dependencies
      run: dotnet restore src/PlainTextReport.sln --verbosity normal

    - name: Build
      run: dotnet build --no-restore -c Release ${PACKAGE_VERSION:+"-p:Version=$PACKAGE_VERSION"} src/PlainTextReport.sln

    - name: Test
      run: dotnet test --no-build -c Release src/PlainTextReport.sln

    - name: Package
      run: dotnet pack --no-build -c Release ${PACKAGE_VERSION:+"-p:Version=$PACKAGE_VERSION"} -o . src/PlainTextReport/PlainTextReport.csproj

    # Trusted Publishing: exchanges the GitHub OIDC token for a short-lived NuGet API key
    - name: NuGet login
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish on NuGet
      run: dotnet nuget push ./*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

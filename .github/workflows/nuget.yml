name: Publish PlainTextReport on NuGet

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  # Required by NuGet Trusted Publishing: GitHub issues the OIDC token exchanged for a temporary API key
  id-token: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # .NET 8 runtime for the net8.0 tests; the SDK version comes from global.json
        dotnet-version: 8.0.x
        global-json-file: global.json

    - name: Get version from tag
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

    - name: Restore dependencies
      run: dotnet restore src/PlainTextReport.sln --verbosity normal

    - name: Build
      run: dotnet build --no-restore -c Release -p:Version="$VERSION" src/PlainTextReport.sln

    - name: Test
      run: dotnet test --no-build -c Release src/PlainTextReport.sln

    - name: Package
      run: dotnet pack --no-build -c Release -p:Version="$VERSION" -o . src/PlainTextReport/PlainTextReport.csproj

    # Trusted Publishing: exchanges the GitHub OIDC token for a short-lived NuGet API key
    - name: NuGet login
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish on NuGet
      run: dotnet nuget push ./*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

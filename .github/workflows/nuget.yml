name: Publish PlainTextReport on NuGet

on:
  push:
    tags: [ 'v*' ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Get version from tag
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

    - name: Restore dependencies
      run: dotnet restore src/PlainTextReport.sln

    - name: Build
      run: dotnet build --no-restore -c Release -p:Version=$VERSION src/PlainTextReport.sln

    - name: Test
      run: dotnet test --no-build -c Release src/PlainTextReport.sln

    - name: Package
      run: dotnet pack --no-build -c Release -p:Version=$VERSION -o . src/PlainTextReport/PlainTextReport.csproj

    - name: Publish on NuGet
      run: dotnet nuget push ./*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

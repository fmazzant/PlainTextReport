name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # .NET 8 runtime for the net8.0 tests; the SDK version comes from global.json
        dotnet-version: 8.0.x
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore src/PlainTextReport.sln --verbosity normal

    - name: Build
      run: dotnet build --no-restore -c Release src/PlainTextReport.sln

    - name: Test
      run: dotnet test --no-build -c Release src/PlainTextReport.sln
